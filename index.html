.fb .ft{position:absolute;top:-17px;left:6px;max-width:calc(100% - 10px);background:#f3e3b3;color:#4a3410;font-family:var(--hand);font-size:.74rem;line-height:1;padding:3px 9px 2px;border-radius:6px 6px 0 0;box-shadow:0 -1px 2px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .fp{display:block;height:50px;overflow:hidden;border:4px solid #fff;border-bottom:0;background:#ddd;box-shadow:0 -1px 4px rgba(0,0,0,.35)}
.fb .fp>img,.fb .fp>svg{display:block;width:100%;height:100%;object-fit:cover}
.cork{z-index:1}
.corkrow{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 10px;padding:6px 0 14px}
.pol{position:relative;width:calc(33.3% - 10px);min-width:82px;background:#fff;padding:6px 6px 22px;box-shadow:0 3px 7px rgba(0,0,0,.45);transform:rotate(var(--r,0deg))}
.pol::before,.cpin::before{content:'';position:absolute;top:-7px;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#d02020 55%,#7a0e0e);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:4}
.pol .ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:#ddd}
.pol .ph>svg,.pol .ph>img{display:block;width:100%;height:100%;object-fit:cover}
.pol .cap{position:absolute;left:4px;right:4px;bottom:3px;text-align:center;font-family:var(--hand);font-size:.82rem;line-height:1.1;color:#2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpin{position:relative;margin:10px auto 18px;width:100%;max-width:560px;background:#fff;padding:7px;box-shadow:0 4px 10px rgba(0,0,0,.5);transform:rotate(-.6deg)}
.cpin>img,.cpin>svg{display:block;width:100%;height:auto}
.cpin .pcb{z-index:5}
.corknote{font-family:var(--hand);color:#fff;text-align:center;padding:10px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:6px 0;font-family:var(--hand);font-size:1.05rem;color:inherit;text-align:left}.tgl i{width:46px;height:26px;border-radius:13px;background:#b8b2a2;position:relative;transition:background .2s;flex:0 0 46px}.tgl i:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}.tgl.on i{background:#4aa83a}.tgl.on i:after{left:23px}
.tgl.sq i{width:48px;height:28px;border-radius:7px;flex:0 0 48px}.tgl.sq i:after{top:3px;left:3px;width:22px;height:22px;border-radius:5px}.tgl.sq.on i:after{left:23px}
.chip.on{background:var(--gn);color:#1f3a1f;border:1.5px solid #6bbd5b;font-weight:600}
.bar{height:11px;border-radius:6px;overflow:hidden;display:flex;background:var(--line)}
.offer{background:var(--bg);border-radius:4px;padding:10px;margin:10px 0}
.offer div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
@media (max-width:480px){main{padding-left:40px;padding-right:10px}main::before{left:30px}}
.dbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.dbar button{flex:1 1 auto}
.dtool{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 12px 12px;box-shadow:0 2px 5px rgba(0,0,0,.18);min-width:0}
.tile::before{content:"";position:absolute;top:-8px;left:50%;width:54px;height:16px;margin-left:-27px;background:rgba(255,235,140,.75);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tile.w{grid-column:1/-1}
.th{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}.th>b{font-size:1.02rem;margin-right:auto}
.tg{background:var(--pi,#ffe27a);color:#2a2a2a;font-size:.72rem;padding:2px 7px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tc{display:flex;gap:3px;width:100%}.tc button{padding:3px 8px;min-width:0}
.pic{position:relative;width:100%;overflow:hidden;border-radius:3px;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:#ddd}
.pic>svg,.pic>img{display:block;width:100%;height:100%;object-fit:cover}
.pic.fit>img{height:auto;max-height:300px;min-height:110px;object-position:center 45%}
.pcb{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.pcm.wide{width:auto;padding:0 10px;border-radius:14px;font-size:.75rem;white-space:nowrap}
.pcm{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;transform:none}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.9rem}.kv:last-child{border:0}
.big{font-size:1.7rem;font-weight:700;margin:2px 0 8px}.big.pos{color:#2a7a3a}.big.neg{color:#b3261e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.two small{display:block;color:var(--muted)}
@media(max-width:560px){.dash{grid-template-columns:1fr}}
/* ===== Designs (data-skin): mag = Grün & Papier, tun = Spielertunnel, bc = Broadcast Cyan ===== */
:root[data-skin]{--btxt:#1b1b1b;color-scheme:light}
:root[data-skin="mag"]{--head:'Playfair Display',Georgia,serif;--hand:'Source Serif 4',Georgia,serif;--desk:#EFE6D2;--paper:#EFE6D2;--card:#F8F1E0;--bg:#E9DFC6;--text:#1D2A20;--muted:#4B5A4F;--line:#D5C8A6;--margin:#B3261E;--accent:#1E5A3A;--neg:#B3261E;--pos:#1E5A3A;--pi:#D9B46A;--pk:#EBB3A4;--bl:#CFDDD0;--gn:#A9D3B4;--or:#E8C48A;--pu:#D6CDEB;--navbg:#123524;--navbd:3px solid #D9B46A;--tabfg:#F3EAD4;--tabbg:transparent;--tonfg:#123524;--tonbg:#EFE6D2}
:root[data-skin="bc"]{--head:'Oswald',Impact,sans-serif;--hand:'IBM Plex Sans',system-ui,sans-serif;--desk:#101114;--paper:#101114;--card:#1B1D23;--bg:#262932;--text:#FFFFFF;--muted:#C9CDD6;--line:#3A3D48;--margin:#00D1FF;--accent:#00D1FF;--neg:#FF7B7B;--pos:#5BE9B0;--pi:#00D1FF;--pk:#FF9A9A;--bl:#C9CDD6;--gn:#5BE9B0;--or:#FFB454;--pu:#C9B8FF;--navbg:#0A0B0D;--navbd:4px solid #00D1FF;--tabfg:#C9CDD6;--tabbg:#1B1D23;--tonfg:#101114;--tonbg:#FFFFFF;color-scheme:dark}
:root[data-skin] body{background-image:none;background-color:var(--desk);color:var(--text);padding:calc(env(safe-area-inset-top,0px) + 74px) 16px env(safe-area-inset-bottom,0px)}
:root[data-skin] main{max-width:1280px;margin:0 auto 28px;padding:8px 0 26px;background:none;box-shadow:none;border-radius:0}
:root[data-skin] main::before,:root[data-skin] main::after{display:none}
:root[data-skin] h1,:root[data-skin] .slogan{display:none}
:root[data-skin] nav{position:fixed;top:0;left:0;right:0;z-index:45;margin:0;padding:env(safe-area-inset-top,0px) 16px 0;height:calc(60px + env(safe-area-inset-top,0px));align-items:flex-end;gap:6px;background:var(--navbg);border-bottom:var(--navbd);box-shadow:0 4px 14px rgba(0,0,0,.35)}
:root[data-skin] nav::before{content:"Off the Pitch";flex:none;align-self:center;margin-right:22px;font-family:var(--head);font-size:1.45rem;font-weight:700;letter-spacing:.5px;color:var(--tabfg);white-space:nowrap}
:root[data-skin="bc"] nav::before{text-transform:uppercase}
:root[data-skin] nav button{background:var(--tabbg);color:var(--tabfg);height:46px;padding:0 18px;border-radius:10px 10px 0 0;box-shadow:none;transform:none!important;font-family:var(--head);font-size:1rem;font-weight:500;letter-spacing:.8px;text-decoration:none!important}
:root[data-skin] nav button::after{display:none}
:root[data-skin] nav button:hover{filter:brightness(1.18)}
:root[data-skin] nav button.on{background:var(--tonbg);color:var(--tonfg);font-weight:700}
:root[data-skin="bc"] nav button{text-transform:uppercase;border-radius:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:0 22px}
:root[data-skin] h2,:root[data-skin] .card>h2,:root[data-skin] .tile .th>b{font-family:var(--head);font-weight:700;letter-spacing:.3px;transform:none}
:root[data-skin="bc"] h2,:root[data-skin="bc"] .card>h2,:root[data-skin="bc"] .tile .th>b,:root[data-skin="tun"] .card>h2,:root[data-skin="tun"] .tile .th>b{text-transform:uppercase;letter-spacing:1px}
:root[data-skin] .card>h2,:root[data-skin] .tile .th>b{--hc:var(--accent)}
:root[data-skin] .card.sec>h2{font-size:2rem}
:root[data-skin] .card.sec>h2::after{background:linear-gradient(90deg,var(--accent) 0 96px,var(--line) 96px 100%)}
:root[data-skin] .card,:root[data-skin] .tile{background:var(--card);color:var(--text);border:0;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.14)}
:root[data-skin] .card::before,:root[data-skin] .tile::before{display:none}
:root[data-skin] .card.sec{background:none;box-shadow:none}
:root[data-skin="mag"] .card,:root[data-skin="mag"] .tile{box-shadow:0 1px 2px rgba(18,53,36,.12),0 8px 22px rgba(18,53,36,.08)}
:root[data-skin="bc"] .card,:root[data-skin="bc"] .tile{border-radius:2px;border-top:4px solid var(--accent);box-shadow:none}
:root[data-skin="bc"] .card.sec{border:0}
:root[data-skin] .stat{background:var(--bg);color:var(--text);transform:none;box-shadow:none;border-radius:10px}
:root[data-skin] .stat small{color:var(--muted)}
:root[data-skin] .stat .pos,:root[data-skin] .big.pos,:root[data-skin] .stm .sd.pos{color:var(--pos)}
:root[data-skin] .stat .neg,:root[data-skin] .stat b.neg,:root[data-skin] .big.neg,:root[data-skin] .stm .sd.neg{color:var(--neg)}
:root[data-skin] button.b,:root[data-skin] button.g,:root[data-skin] label.lg{color:var(--btxt);border-radius:10px;transform:none;box-shadow:0 1px 2px rgba(0,0,0,.25);font-family:var(--hand);font-weight:600}
:root[data-skin] button.b::after,:root[data-skin] button.g::after,:root[data-skin] label.lg::after{display:none}
:root[data-skin] button.b:hover,:root[data-skin] button.g:hover{transform:translateY(-1px);filter:brightness(1.06)}
:root[data-skin] button.b:active,:root[data-skin] button.g:active{transform:translateY(1px)}
:root[data-skin="bc"] button.b,:root[data-skin="bc"] button.g,:root[data-skin="bc"] label.lg{border-radius:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-left:18px;padding-right:18px;box-shadow:none}
:root[data-skin] #balpill{background:var(--card);color:var(--text);border-color:var(--accent)}
:root[data-skin] .md{background:var(--card);color:var(--text);transform:none;border-radius:16px;border:1.5px solid var(--accent)}
:root[data-skin] .md p,:root[data-skin] .md label{color:var(--muted)}
:root[data-skin] .md input,:root[data-skin] .md select,:root[data-skin] .md textarea{background:var(--bg);color:var(--text);border-bottom-color:var(--muted)}
:root[data-skin] .md select{background-color:var(--bg)}
:root[data-skin] .md button.b{--pc:var(--gn)}
:root[data-skin] details.stm{background:rgba(0,0,0,.08);border-color:var(--line)}
:root[data-skin] .tl .ct{background:rgba(0,0,0,.1)}
:root[data-skin] .kslot.on{background:rgba(255,255,255,.12)}
:root[data-skin] .item{border-bottom-color:var(--line)}
:root[data-skin] .chip.on{color:#1b1b1b}
:root[data-skin] .seg button.on,:root[data-skin] .chip.on.top{color:#1b1b1b}
:root[data-skin] .bt{background:linear-gradient(transparent,rgba(0,0,0,.72))}
:root[data-skin] .cpin,:root[data-skin] .pol{color:#2a2a2a}
:root[data-skin] button.g[data-tab]{transform:none!important;text-decoration:none!important}
:root[data-skin] button.g[data-tab][style*="font-weight:700"]{box-shadow:0 0 0 3px var(--accent)}
:root[data-skin] button.g[style*="underline"]{text-decoration:none!important;transform:none!important;box-shadow:0 0 0 3px var(--accent)}
/* ===== Design v2: modernerer Aufbau (Spalten, Pillen, ruhige Karten) ===== */
:root[data-skin="mag"]{--hand:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--r:20px}
:root[data-skin="bc"]{--r:4px}
:root[data-skin] body{font-size:16px;line-height:1.45}
:root[data-skin] main{max-width:1360px;padding-top:4px}
@media(min-width:1000px){
:root[data-skin] #view{columns:2 440px;column-gap:24px}
:root[data-skin] #view>*{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:24px}
:root[data-skin] #view:has(>.dash)>.card,:root[data-skin] #view>.dash,:root[data-skin] #view>.card.sec,:root[data-skin] #view>.dtool,:root[data-skin] #view>.dbar,:root[data-skin] #view>.card:has(>.row>button[data-tab]),:root[data-skin] #view>.card:has(>.row>.seg){column-span:all}
}
:root[data-skin] .dash{gap:24px;margin-bottom:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media(min-width:900px){:root[data-skin] .dash{grid-template-columns:repeat(3,1fr)}:root[data-skin] .tile.w{grid-column:span 2}}
@media(min-width:1300px){:root[data-skin] .dash{grid-template-columns:repeat(4,1fr)}}
:root[data-skin] .card,:root[data-skin] .tile{border-radius:var(--r,16px);padding:22px;margin-bottom:24px}
:root[data-skin] .tile{margin-bottom:0}
:root[data-skin] .card>h2,:root[data-skin] .tile .th>b{font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:0;margin:0 0 14px;display:flex;align-items:center;gap:10px}
:root[data-skin] .card>h2::before,:root[data-skin] .tile .th>b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
:root[data-skin] .card>h2::after,:root[data-skin] .tile .th>b::after{display:none}
:root[data-skin] .card.sec>h2{font-size:2.1rem;text-transform:none;letter-spacing:0;color:var(--text);font-family:var(--head)}
:root[data-skin] .card.sec>h2::before{display:none}
:root[data-skin] .card.sec{margin:8px 0 18px;padding:0}
:root[data-skin] .tile .th>b{font-size:.9rem}
:root[data-skin="bc"] .card,:root[data-skin="bc"] .tile{border-top:0;border-left:4px solid var(--accent)}
:root[data-skin="bc"] .card.sec{border:0}
:root[data-skin] .pic{border:0;border-radius:calc(var(--r,16px) - 4px);box-shadow:none}
:root[data-skin] .stat{border-radius:calc(var(--r,16px) - 6px);padding:14px 16px}
:root[data-skin] .stat b{font-size:1.45rem}
:root[data-skin] .big{font-size:2.1rem;letter-spacing:-.02em}
:root[data-skin] .item{padding:12px 0}
:root[data-skin] .chip,:root[data-skin] button.chip{border:0;background:var(--bg);color:var(--text);border-radius:999px;padding:7px 14px}
:root[data-skin] .chip.on{background:var(--accent);color:var(--tonfg,#fff);border:0}
:root[data-skin="mag"] .chip.on{color:#fff}
:root[data-skin="bc"] .chip.on{color:#101114}
:root[data-skin] .chip.on.top{background:var(--accent);border:0}
:root[data-skin] .seg{border:0;background:var(--bg)}
:root[data-skin] .seg button.on{background:var(--accent);color:#fff;box-shadow:none}
:root[data-skin="bc"] .seg button.on{color:#101114}
:root[data-skin] .dbar{margin:0 0 16px;gap:8px;align-items:center}
:root[data-skin] .dbar button{flex:0 0 auto;padding:8px 16px;font-size:.9rem;border-radius:999px;box-shadow:none;background:var(--card);color:var(--text);border:1.5px solid var(--line);clip-path:none}
:root[data-skin] .dbar button:first-child{background:var(--accent);color:var(--tonfg,#fff);border-color:var(--accent)}
:root[data-skin="mag"] .dbar button:first-child{color:#fff}
:root[data-skin="bc"] .dbar button:first-child{color:#101114}

:root[data-skin] .card:has(>.row>button[data-tab]) button.g{background:var(--card);color:var(--muted);border-radius:999px;box-shadow:none;border:1.5px solid var(--line);padding:8px 18px;flex:0 0 auto}

:root[data-skin] nav{height:calc(64px + env(safe-area-inset-top,0px))}
:root[data-skin] nav button{border-radius:999px;height:40px;align-self:center;margin-bottom:0;padding:0 18px;font-weight:600}

:root[data-skin="bc"] nav button.on{background:#00D1FF;color:#101114}
:root[data-skin] nav::before{margin-right:26px}
:root[data-skin] button.b{border-radius:12px;padding:13px 18px}
:root[data-skin] #balpill{border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* Datums-Dropdown */
.dd{position:relative;display:inline-block}
.dd>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-weight:700;background:var(--pi);color:#2a2a2a;box-shadow:0 1px 2px rgba(0,0,0,.25);user-select:none}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary i{width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.dd[open]>summary i{transform:translateY(1px) rotate(-135deg)}
.ddm{position:absolute;left:0;top:calc(100% + 8px);z-index:44;min-width:210px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.ddm button{width:100%;text-align:left;--pc:var(--bl)}
.ddm button[data-act="askdate"]{--pc:var(--pi)}
:root[data-skin] .dd>summary{background:var(--accent);color:#fff;box-shadow:none}
:root[data-skin="mag"] .dd>summary{background:#1E5A3A;color:#fff}
:root[data-skin="bc"] .dd>summary{background:#00D1FF;color:#101114;border-radius:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:9px 24px}
:root[data-skin] .ddm button{clip-path:none;border-radius:10px;background:var(--bl);color:#1b1b1b;border:0;padding:10px 14px;font-size:.95rem}
:root[data-skin] .ddm button[data-act="askdate"]{background:var(--pi)}
@media(max-width:560px){:root[data-skin] body{padding-left:10px;padding-right:10px}:root[data-skin] nav::before{margin-right:12px;font-size:1.2rem}:root[data-skin] nav button{padding:0 13px}}
/* iPhone: Rubriken unten als Tab-Leiste */
@media(max-width:700px){
:root[data-skin] body{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
:root[data-skin] nav{top:auto;bottom:0;height:auto;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 4px);gap:0;justify-content:space-around;overflow:hidden;border-bottom:0;border-top:var(--navbd);box-shadow:0 -6px 18px rgba(0,0,0,.28)}

function lifeExtra(m,dt){var fx=0;

  else{l.st='ok';l.passed=dt;news('Bestanden: '+d.n+'!'+(l.tries?' Im '+(l.tries+1)+'. Anlauf.':''),dt)}});
 S.props.forEach(function(p){var c=propMc(p);if(c>0&&mIdx(p.date)<m){tx('Unterhalt Haus: '+p.name,-c,dt);fx+=c}});
 S.cars.forEach(function(q){if(mIdx(q.date)<m){var c=carMc(q);tx('Unterhalt Auto: '+q.name,-c,dt);fx+=c;var sp=carFuel(q);if(sp>0){tx('Sprit: '+q.name,-sp,dt);fx+=sp}}});

 S.hobs.forEach(function(h){if(!h.on)return;var d=hobD(h.k),c=hobMc(h);tx('Freizeit '+d.n+': '+d.note,-c,dt);fx+=c;h.pts=(h.pts||0)+3+Math.random()*5;var r=Math.random();
